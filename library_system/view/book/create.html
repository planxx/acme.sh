<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图书入库</title>
</head>
<body>
<h1>图书入库</h1>
<p><a href="/books">返回图书列表</a></p>
<form action="/books" method="post">
  <p>书名：<input type="text" name="title" required></p>
  <p>作者：<input type="text" name="author" required></p>
  <p>ISBN：<input type="text" name="isbn" required></p>
  <p>库存：<input type="number" name="total_stock" min="1" value="1" required></p>
  <button type="submit">保存</button>
</form>
</body>
</html>
